<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Bites - Cupcakes & Cafés</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fafafa; margin: 0; padding: 20px; text-align: center; }
        header { background-color: #4a2c2a; color: white; padding: 25px; border-radius: 8px; }
        .card { background: white; padding: 20px; margin: 20px auto; max-width: 400px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn { background-color: #d9534f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Gourmet Bites</h1>
        <p>E-commerce de Cupcakes Artesanais e Bebidas Especializadas</p>
    </header>
    <div class="card">
        <h2>Vitrine de Produtos</h2>
        <p>Navegue por categorias, monte seu pedido e envie sua avaliação!</p>
        <button class="btn">Ver Catálogo</button>
    </div>
</body>
</html>
